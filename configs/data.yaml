# Dataset configuration
# All scripts read this file. Override individual fields on the CLI if needed.

# ---- Scope --------------------------------------------------------------
crops:
  - winter_wheat
  - winter_barley
  - rye
  - triticale
  - winter_rapeseed
  - summer_barley
  - oats
  - silage_maize
  - potatoes
  - sugar_beet

years:
  start: 2003
  end: 2025

# Comma-separated list of NUTS-3 (Landkreis) codes, or "all" to use every Landkreis
# in the yield table. Default keeps things small for development.
landkreise: "all"

# ---- Temporal granularity -----------------------------------------------
# Weather is daily; satellite is composited to N-day intervals.
weather_freq: "D"               # pandas freq string
satellite_composite_days: 10    # 10-day NDVI/EVI/LAI composites

# ---- Leakage-safe model features -----------------------------------------
# This is the single source of truth for training and evaluation. Features
# omitted here are not passed to a model even when present in dataset.parquet.
features:
  past_observed:
    - temperature_air_max_2m
    - wind_speed          # v10 §2.2 (ERA5-Land 10 m wind); absent in older datasets -> skipped
    - temperature_air_min_2m
    - precipitation_height
    - humidity
    - ndvi
    - evi
    - lai
    - ndwi
    # Available after rebuilding the interim/processed data with the updated
    # cleaners. These expose imputation instead of silently hiding it.
    - temperature_air_max_2m_missing
    - temperature_air_min_2m_missing
    - precipitation_height_missing
    - humidity_missing
    - ndvi_observed
    - lai_observed
    - ndwi_observed
    - ndvi_stale
    - lai_stale
    - ndwi_stale
    - ndvi_age_days
    - lai_age_days
    - ndwi_age_days
    # Water- and energy-stress drivers (ERA5-Land + MODIS fPAR via Earth
    # Engine; scripts/25, 26, 29). Daily and causal: swroot7 is a trailing
    # 7-day mean, fpar is carried forward at most 16 days.
    - swvl1
    - swvl2
    - swvl3
    - swroot7
    - ssrd
    - vpd
    - pet
    - cwb
    - hotdry
    - fpar
    # Pre-registered arm C indicators (scripts/33; preregistration §4.2)
    - heavyrain
    - wetsoil
    - soiltemp
    - snowdepth
    - barefrost
    - transp_ratio
    # Pre-registered arm D cropland-only satellite (scripts/33; §4.3)
    - ndvi_crop
    - evi_crop
    - lai_crop
    - fpar_crop
  static:
    - sand
    - clay
    - soc
    - ph
    - bulk_density
    - soil_imputed
    - landkreis_id
    - elevation_mean
    - elevation_std
    - elevation_max
    - slope_mean
    - slope_std
    - aspect_cos_mean
    - aspect_sin_mean
    # One-hot crop identity. Pooled multi-crop models previously had no
    # way to tell which crop a sample was; they had been reading it off the
    # zero-padding tail length, which the padding fix removed.
    - crop_is_winter_wheat
    - crop_is_winter_barley
    - crop_is_rye
    - crop_is_triticale
    - crop_is_winter_rapeseed
    - crop_is_summer_barley
    - crop_is_oats
    - crop_is_silage_maize
    - crop_is_potatoes
    - crop_is_sugar_beet
  known_future:
    - sin_doy
    - cos_doy
  excluded:
    # 90.5% missing in the source weather table; constant-imputed for most
    # districts in the current processed dataset.
    - radiation_global
    # Same-year full-season NDVI summaries use observations after early-season
    # prediction cutoffs (and sometimes after harvest), so they leak the future.
    - sos_doy
    - eos_doy
    - los_days
    - peak_doy
    - peak_ndvi
    - amplitude_ndvi
    - auc_growing
    # COP-DEM coastline/raster artefacts produced impossible district minima.
    - elevation_min
    # NDVI and EVI come from the same MODIS product on the same acquisition
    # dates, so their observation/age/staleness indicators are necessarily
    # identical. Verified byte-identical to the ndvi_* versions across all
    # 16,562,352 rows (0 mismatches each). Three of twenty past-observed
    # channels carried zero incremental information, and perfectly collinear
    # inputs actively hurt the linear model. lai_* is NOT a duplicate
    # (1,046,335 mismatches) and is retained.
    - evi_observed
    - evi_stale
    - evi_age_days

# Reject crop sequences that contain less than this fraction of their expected
# configured growing-season days. Applied before train/val/test splitting and
# before any in-season cutoff.
quality:
  min_sequence_coverage: 0.90

# ---- Phenology window (per crop, used to slice the time series) ---------
# Approximate German growing-season start/end (DOY = day of year).
# Winter crops: sowing_doy > harvest_doy (sown previous autumn, harvested
# the following summer) → window is [1, harvest_doy] of the harvest year.
# Summer crops: sowing_doy < harvest_doy → window is [sowing_doy, harvest_doy].
phenology:
  # --- Winter crops (autumn-sown) ---
  winter_wheat:
    sowing_doy: 280     # ~early October (previous year)
    harvest_doy: 220    # ~early August
  winter_barley:
    sowing_doy: 270     # ~late September
    harvest_doy: 195    # ~mid July (earliest-harvested cereal)
  rye:
    sowing_doy: 270     # ~late September
    harvest_doy: 210    # ~late July
  triticale:
    sowing_doy: 275     # ~early October
    harvest_doy: 215    # ~early August
  winter_rapeseed:
    sowing_doy: 235     # ~late August (previous year)
    harvest_doy: 200    # ~mid July
  # --- Summer crops (spring-sown) ---
  summer_barley:
    sowing_doy: 80      # ~late March
    harvest_doy: 215    # ~early August
  oats:
    sowing_doy: 90      # ~end of March
    harvest_doy: 235    # ~late August
  silage_maize:
    sowing_doy: 120     # ~early May
    harvest_doy: 270    # ~late September
  potatoes:
    sowing_doy: 105     # ~mid April
    harvest_doy: 270    # ~late September
  sugar_beet:
    sowing_doy: 95      # ~early April
    harvest_doy: 300    # ~late October

# ---- Splits -------------------------------------------------------------
splits:
  temporal:
    train_end_year: 2022
    val_years: [2023]
    test_years: [2024, 2025]
  spatial:
    strategy: "leave-one-out"   # or "stratified"
    sample_size: 50             # subsample N Landkreise for LOO sweep

# ---- Horizons (days before harvest at which to evaluate) ----------------
in_season_horizons_days: [30, 60, 90, 120]

# ---- Paths --------------------------------------------------------------
paths:
  raw: "data/raw"
  interim: "data/interim"
  processed: "data/processed"
  unified_dataset: "data/processed/dataset.parquet"
