# LSTM baseline
name: lstm
hidden_size: 128
num_layers: 2
dropout: 0.2
bidirectional: false
learning_rate: 0.001
batch_size: 128
# LSTM broadcasts statics to every timestep. Adding the 15 land-eng features
# on top of the original 6 diluted the temporal signal (regression 0.502 →
# 0.294 on julia2 vs samal). Keep LSTM restricted to the original 6 soil +
# landkreis statics; other models still get all 21 via CANDIDATE_STATIC.
static_features:
  - sand
  - clay
  - soc
  - ph
  - bulk_density
  - landkreis_id
