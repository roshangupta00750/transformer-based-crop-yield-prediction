# Temporal Fusion Transformer (Lim et al., 2021)
# Implementation: pytorch-forecasting.TemporalFusionTransformer
name: tft
hidden_size: 64
attention_head_size: 4
dropout: 0.1
hidden_continuous_size: 32
# QuantileLoss collapsed on summer_barley (min_r2 = -70.161). Switch to MAE
# with single-point output — the anomaly-framed target is not quantile-shaped.
output_size: 1
loss: "mae"
learning_rate: 0.0003     # was 1e-3; lower LR for MAE stability
batch_size: 128

# Per-model budget override. Every TFT run so far terminated at exactly the
# shared 60-minute cap (fit_seconds 3612.6 = 60.21 min) after roughly 2-3 of
# its configured 200 epochs, so its reported R² was a wall-clock artefact
# rather than a measurement of the architecture. Now that validation actually
# works (from_dataset + EarlyStopping + ModelCheckpoint), a larger budget can
# be spent safely: training stops on the val plateau if it arrives first, and
# the weights kept are the best-validation ones either way.
max_minutes: 180
