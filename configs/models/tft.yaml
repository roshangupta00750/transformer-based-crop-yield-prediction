# Temporal Fusion Transformer (Lim et al., 2021)
# Implementation: pytorch-forecasting.TemporalFusionTransformer
name: tft
hidden_size: 64
attention_head_size: 4
dropout: 0.1
hidden_continuous_size: 32
# QuantileLoss collapsed on summer_barley (min_r2 = -70.161). Switch to MAE
# with single-point output — the anomaly-framed target is not quantile-shaped.
output_size: 1
loss: "mae"
learning_rate: 0.0003     # was 1e-3; lower LR for MAE stability
batch_size: 128
