# Pre-registration v17 arm T17 (paper/preregistration_2026-10-10_v17.md): Temporal Fusion Transformer,
# native implementation (src/models/tft_native.py); data settings identical to v12 Q12 below
name: tftnet
hidden_size: 64
n_heads: 4
dropout: 0.15
learning_rate: 0.0005
batch_size: 128
max_epochs: 120
early_stopping_patience: 15
weight_decay: 0.05

# --- pre-registration controls (identical in all arms) ---
max_minutes: 120
resample_len: 220         # same model size in every arm
common_sample: true       # same crop-years in every arm
# --- what this arm changes ---
window: crop_year
drop_features: [ndvi, evi, lai, fpar]
# --- v2 ---
dataset: data/processed/dataset_v5_hybridW.parquet
phenology: full
phenology_version: v3
stage_features: true
district_anomaly: true
national: false
# --- v4 ---
trend_test: yearly
# --- v10 ---
trend_district_ref: true
# --- v12 ---
reliable_series: true
